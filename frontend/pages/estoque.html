<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Estoque - FoodControl</title>
    <link rel="stylesheet" href="../assets/css/style.css" />
  </head>
  <body data-grupo="Operação" data-pagina="Estoque">
    <div class="app-layout">
      <main class="app-main">
        <div class="page-container">
          <div class="page-header">
            <div class="page-title-group">
              <h1>Controle de Estoque</h1>
              <p>Histórico de entradas, saídas, perdas e ajustes nos lotes.</p>
            </div>
            <div class="page-actions">
              <button type="button" class="btn btn-primary" data-modal-target="modalMovimentacao">+ Nova Movimentação</button>
            </div>
          </div>

          <section class="card-panel">
            <div class="panel-header">
              <div class="panel-title"><h2>Histórico de Movimentações</h2></div>
              <span id="totalMovBadge" class="panel-badge">0 registros</span>
            </div>
            <div class="table-responsive">
              <table class="data-table">
                <thead>
                  <tr>
                    <th>Data</th>
                    <th>Lote</th>
                    <th>Produto</th>
                    <th>Tipo</th>
                    <th class="num">Quantidade</th>
                    <th>Responsável</th>
                    <th>Motivo</th>
                  </tr>
                </thead>
                <tbody id="tabelaMovEstoque">
                  <tr><td colspan="7" style="text-align: center; color: var(--text-muted)">Carregando...</td></tr>
                </tbody>
              </table>
            </div>
          </section>
        </div>
      </main>
    </div>

    <div id="modalMovimentacao" class="modal-backdrop">
      <div class="modal-box">
        <div class="modal-header">
          <h3>Registrar Movimentação</h3>
          <button type="button" class="modal-close-btn" style="font-size: 20px; line-height: 1" data-modal-close>&times;</button>
        </div>
        <form id="formMovimentacao">
          <div class="modal-body">
            <div class="form-grid">
              <div class="form-group full-width">
                <label for="movLote">Lote</label>
                <select id="movLote" class="select-control" required></select>
              </div>
              <div class="form-group">
                <label for="movTipo">Tipo</label>
                <select id="movTipo" class="select-control" required>
                  <option value="Saida">Saída</option>
                  <option value="Entrada">Entrada</option>
                  <option value="Ajuste">Ajuste</option>
                </select>
              </div>
              <div class="form-group">
                <label for="movQtd">Quantidade</label>
                <input id="movQtd" type="number" class="input-control" required placeholder="Ex: 20" />
              </div>
              <div class="form-group full-width">
                <label for="movObs">Observação / Motivo</label>
                <input id="movObs" type="text" class="input-control" placeholder="Ex: Conferência de inventário" />
              </div>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-modal-close>Cancelar</button>
            <button type="submit" class="btn btn-primary">Confirmar</button>
          </div>
        </form>
      </div>
    </div>

    <script src="../assets/js/main.js"></script>
    <script>
      async function carregarEstoque() {
        try {
          const [movs, lotes] = await Promise.all([
            apiRequest('/estoque/movimentacoes'),
            apiRequest('/lotes')
          ]);

          document.getElementById('totalMovBadge').innerText = `${movs.length} registro(s)`;

          let htmlMov = '';
          for (let i = 0; i < movs.length; i++) {
            const m = movs[i];
            const badgeTipo = m.tipo === 'Entrada' ? 'badge-normal' : (m.tipo === 'Saida' ? 'badge-info' : (m.tipo === 'Perda' ? 'badge-critico' : 'badge-atencao'));
            const qtdTexto = m.quantidade > 0 ? `+${formatarNumero(m.quantidade)} un` : `${formatarNumero(m.quantidade)} un`;
            const corQtd = m.quantidade > 0 ? 'color: #059669' : 'color: var(--status-critico-text)';
            htmlMov += `
              <tr>
                <td>${formatarDataBR(m.data_hora)}</td>
                <td><span style="font-family: monospace">${m.numero_lote}</span></td>
                <td>${m.produto_nome}</td>
                <td>${criarBadge(badgeTipo, m.tipo, false)}</td>
                <td class="num font-semibold" style="${corQtd}">${qtdTexto}</td>
                <td>${m.responsavel}</td>
                <td>${m.observacao || '-'}</td>
              </tr>
            `;
          }
          document.getElementById('tabelaMovEstoque').innerHTML = htmlMov || '<tr><td colspan="7">Nenhuma movimentação registrada.</td></tr>';

          let optsLotes = '';
          for (let i = 0; i < lotes.length; i++) {
            const lt = lotes[i];
            optsLotes += `<option value="${lt.id_lote}">${lt.numero_lote} - ${lt.produto_nome} (Saldo: ${lt.quantidade_atual} un | ${lt.status})</option>`;
          }
          document.getElementById('movLote').innerHTML = optsLotes;
        } catch (erro) {
          showToast(erro.message, 'warning');
        }
      }

      document.getElementById('formMovimentacao').addEventListener('submit', async (e) => {
        e.preventDefault();
        const usuario = obterUsuarioLogado();
        try {
          await apiRequest('/estoque/movimentacoes', 'POST', {
            id_lote: parseInt(document.getElementById('movLote').value, 10),
            tipo: document.getElementById('movTipo').value,
            quantidade: parseInt(document.getElementById('movQtd').value, 10),
            id_usuario: usuario ? usuario.id_usuario : 3,
            observacao: document.getElementById('movObs').value.trim()
          });
          showToast('Movimentação registrada com sucesso!', 'success');
          document.getElementById('formMovimentacao').reset();
          fecharModal('modalMovimentacao');
          carregarEstoque();
        } catch (erro) {
          showToast(erro.message, 'warning');
        }
      });

      document.addEventListener('DOMContentLoaded', carregarEstoque);
    </script>
  </body>
</html>

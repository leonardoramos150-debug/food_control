<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Usuários - FoodControl</title>
    <link rel="stylesheet" href="../assets/css/style.css" />
  </head>
  <body data-grupo="Administração" data-pagina="Usuários">
    <div class="app-layout">
      <main class="app-main">
        <div class="page-container">
          <div class="page-header">
            <div class="page-title-group">
              <h1>Usuários e Acessos</h1>
              <p>Gerencie os funcionários com acesso ao sistema e seus perfis.</p>
            </div>
            <div class="page-actions">
              <button type="button" class="btn btn-primary" data-modal-target="modalNovoUsuario">+ Novo Usuário</button>
            </div>
          </div>

          <section class="card-panel">
            <div class="panel-header">
              <div class="panel-title"><h2>Usuários Cadastrados</h2></div>
              <span id="totalUsuariosBadge" class="panel-badge">0 usuários</span>
            </div>
            <div class="table-responsive">
              <table class="data-table">
                <thead>
                  <tr>
                    <th>Nome</th>
                    <th>E-mail</th>
                    <th>Perfil de Acesso</th>
                    <th>Cargo</th>
                    <th>Status</th>
                    <th style="text-align: right">Ações</th>
                  </tr>
                </thead>
                <tbody id="tabelaUsuarios">
                  <tr><td colspan="6" style="text-align: center; color: var(--text-muted)">Carregando usuários...</td></tr>
                </tbody>
              </table>
            </div>
          </section>
        </div>
      </main>
    </div>

    <div id="modalNovoUsuario" class="modal-backdrop">
      <div class="modal-box">
        <div class="modal-header">
          <h3 id="tituloModalUsuario">Cadastrar Novo Usuário</h3>
          <button type="button" class="modal-close-btn" style="font-size: 20px; line-height: 1" data-modal-close>&times;</button>
        </div>
        <form id="formUsuario">
          <input type="hidden" id="uId" />
          <div class="modal-body">
            <div class="form-grid">
              <div class="form-group full-width">
                <label for="uNome">Nome Completo</label>
                <input id="uNome" type="text" class="input-control" required placeholder="Nome e sobrenome" />
              </div>

              <div class="form-group full-width">
                <label for="uEmail">E-mail</label>
                <input id="uEmail" type="email" class="input-control" required placeholder="nome@saborsul.com.br" />
              </div>

              <div class="form-group">
                <label for="uPerfil">Perfil de Acesso</label>
                <select id="uPerfil" class="select-control" required>
                  <option value="administrador">Administrador</option>
                  <option value="producao">Produção</option>
                  <option value="estoque">Estoque</option>
                  <option value="qualidade">Qualidade</option>
                </select>
              </div>

              <div class="form-group">
                <label for="uCargo">Cargo</label>
                <input id="uCargo" type="text" class="input-control" placeholder="Ex: Supervisor" />
              </div>

              <div class="form-group full-width">
                <label for="uSenha">Senha (obrigatória no cadastro; opcional na edição)</label>
                <input id="uSenha" type="password" class="input-control" placeholder="••••••" />
              </div>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-modal-close>Cancelar</button>
            <button type="submit" class="btn btn-primary">Salvar Usuário</button>
          </div>
        </form>
      </div>
    </div>

    <script src="../assets/js/main.js"></script>
    <script>
      let listaUsuarios = [];

      async function carregarUsuarios() {
        try {
          listaUsuarios = await apiRequest('/usuarios');
          document.getElementById('totalUsuariosBadge').innerText = `${listaUsuarios.length} usuário(s)`;

          const nomesPerfis = { administrador: 'Administrador', producao: 'Produção', estoque: 'Estoque', qualidade: 'Qualidade' };
          const badgesPerfis = { administrador: 'badge-petroleo', producao: 'badge-info', estoque: 'badge-atencao', qualidade: 'badge-critico' };

          let html = '';
          for (let i = 0; i < listaUsuarios.length; i++) {
            const u = listaUsuarios[i];
            const badgeStatus = u.status === 'Ativo' ? criarBadge('badge-normal', 'Ativo') : criarBadge('badge-critico', 'Inativo');
            html += `
              <tr style="${u.status === 'Inativo' ? 'opacity: 0.6' : ''}">
                <td><span class="cell-primary">${u.nome}</span></td>
                <td style="color: var(--text-secondary)">${u.email}</td>
                <td>${criarBadge(badgesPerfis[u.perfil] || 'badge-info', nomesPerfis[u.perfil] || u.perfil, false)}</td>
                <td>${u.cargo || '-'}</td>
                <td>${badgeStatus}</td>
                <td style="text-align: right; display: flex; gap: 6px; justify-content: flex-end">
                  <button type="button" class="btn btn-secondary btn-sm" onclick="editarUsuario(${u.id_usuario})">Editar</button>
                  <button type="button" class="btn btn-danger-outline btn-sm" onclick="alternarStatusUsuario(${u.id_usuario}, '${u.status}')">${u.status === 'Ativo' ? 'Inativar' : 'Ativar'}</button>
                </td>
              </tr>
            `;
          }
          document.getElementById('tabelaUsuarios').innerHTML = html;
        } catch (erro) {
          showToast(erro.message, 'warning');
        }
      }

      function editarUsuario(id) {
        let usu = null;
        for (let i = 0; i < listaUsuarios.length; i++) {
          if (listaUsuarios[i].id_usuario === id) { usu = listaUsuarios[i]; break; }
        }
        if (!usu) return;
        document.getElementById('tituloModalUsuario').innerText = 'Editar Usuário';
        document.getElementById('uId').value = usu.id_usuario;
        document.getElementById('uNome').value = usu.nome;
        document.getElementById('uEmail').value = usu.email;
        document.getElementById('uPerfil').value = usu.perfil;
        document.getElementById('uCargo').value = usu.cargo || '';
        document.getElementById('uSenha').value = '';
        abrirModal('modalNovoUsuario');
      }

      async function alternarStatusUsuario(id, statusAtual) {
        const novo = statusAtual === 'Ativo' ? 'Inativo' : 'Ativo';
        if (!confirm(`Deseja ${novo === 'Inativo' ? 'inativar' : 'ativar'} este usuário?`)) return;
        try {
          await apiRequest(`/usuarios/${id}/status`, 'PUT', { status: novo });
          showToast(`Usuário alterado para ${novo}.`, 'success');
          carregarUsuarios();
        } catch (erro) {
          showToast(erro.message, 'warning');
        }
      }

      document.getElementById('formUsuario').addEventListener('submit', async (e) => {
        e.preventDefault();
        const id = document.getElementById('uId').value;
        const dados = {
          nome: document.getElementById('uNome').value.trim(),
          email: document.getElementById('uEmail').value.trim(),
          perfil: document.getElementById('uPerfil').value,
          cargo: document.getElementById('uCargo').value.trim(),
          senha: document.getElementById('uSenha').value
        };

        try {
          if (id) {
            await apiRequest(`/usuarios/${id}`, 'PUT', dados);
            showToast('Usuário atualizado com sucesso!', 'success');
          } else {
            await apiRequest('/usuarios', 'POST', dados);
            showToast('Usuário cadastrado com sucesso!', 'success');
          }
          document.getElementById('formUsuario').reset();
          document.getElementById('uId').value = '';
          document.getElementById('tituloModalUsuario').innerText = 'Cadastrar Novo Usuário';
          fecharModal('modalNovoUsuario');
          carregarUsuarios();
        } catch (erro) {
          showToast(erro.message, 'warning');
        }
      });

      document.querySelector('[data-modal-target="modalNovoUsuario"]')?.addEventListener('click', () => {
        document.getElementById('formUsuario').reset();
        document.getElementById('uId').value = '';
        document.getElementById('tituloModalUsuario').innerText = 'Cadastrar Novo Usuário';
      });

      document.addEventListener('DOMContentLoaded', carregarUsuarios);
    </script>
  </body>
</html>

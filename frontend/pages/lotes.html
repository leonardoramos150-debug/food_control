<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lotes & Validade - FoodControl</title>
    <link rel="stylesheet" href="../assets/css/style.css" />
  </head>
  <body data-grupo="Operação" data-pagina="Lotes & Validade">
    <div class="app-layout">
      <main class="app-main">
        <div class="page-container">
          <div class="page-header">
            <div class="page-title-group">
              <h1>Lotes em Estoque</h1>
              <p>Lotes ordenados pela data de validade (FEFO).</p>
            </div>
            <div class="page-actions">
              <a href="producao.html" class="btn btn-primary">+ Nova Produção</a>
            </div>
          </div>

          <section class="card-panel">
            <div class="filter-bar">
              <div class="filter-group" style="flex: 1; min-width: 220px">
                <label for="tableSearchInput">Pesquisar Lote ou Produto</label>
                <input type="search" id="tableSearchInput" class="input-control" placeholder="Buscar por LOT-2026-... ou alimento" />
              </div>

              <div class="filter-group">
                <label for="tableCategoryFilter">Produto</label>
                <select id="tableCategoryFilter" class="select-control">
                  <option value="todas">Todos os Produtos</option>
                </select>
              </div>

              <div class="filter-group">
                <label for="tableStatusFilter">Situação de Validade</label>
                <select id="tableStatusFilter" class="select-control">
                  <option value="todos">Todas</option>
                  <option value="crítico">Crítico (≤ 7 dias)</option>
                  <option value="atenção">Atenção (8 a 15 dias)</option>
                  <option value="vencido">Vencido</option>
                  <option value="normal">Normal (> 15 dias)</option>
                </select>
              </div>

              <div style="margin-left: auto; align-self: flex-end; padding-bottom: 6px">
                <span id="tableRowCount" style="font-size: 12px; color: var(--text-muted); font-weight: 600">Carregando...</span>
              </div>
            </div>

            <div class="table-responsive">
              <table class="data-table">
                <thead>
                  <tr>
                    <th>Lote</th>
                    <th>Produto</th>
                    <th>Produção</th>
                    <th>Validade</th>
                    <th class="num">Saldo</th>
                    <th>Situação FEFO</th>
                    <th style="text-align: right">Ação</th>
                  </tr>
                </thead>
                <tbody id="tabelaLotes">
                  <tr><td colspan="7" style="text-align: center; color: var(--text-muted)">Carregando lotes...</td></tr>
                </tbody>
              </table>
            </div>
          </section>
        </div>
      </main>
    </div>

    <script src="../assets/js/main.js"></script>
    <script>
      async function carregarLotes() {
        try {
          const lotes = await apiRequest('/lotes');
          const nomesProds = {};
          let optsProd = '<option value="todas">Todos os Produtos</option>';
          let html = '';

          for (let i = 0; i < lotes.length; i++) {
            const lt = lotes[i];
            if (!nomesProds[lt.produto_nome]) {
              nomesProds[lt.produto_nome] = true;
              optsProd += `<option value="${lt.produto_nome.toLowerCase()}">${lt.produto_nome}</option>`;
            }

            let badgeHtml = criarBadge('badge-normal', `Normal (${lt.dias_para_vencer} dias)`);
            if (lt.situacao_validade === 'Vencido') badgeHtml = criarBadge('badge-critico', 'Vencido');
            else if (lt.situacao_validade === 'Critico') badgeHtml = criarBadge('badge-critico', `Crítico (${lt.dias_para_vencer} dias)`);
            else if (lt.situacao_validade === 'Atencao') badgeHtml = criarBadge('badge-atencao', `Atenção (${lt.dias_para_vencer} dias)`);
            else if (lt.situacao_validade === 'Esgotado') badgeHtml = criarBadge('badge-info', 'Esgotado', false);

            const acaoHtml = lt.situacao_validade === 'Vencido' && lt.quantidade_atual > 0
              ? '<a href="perdas.html" class="btn btn-danger-outline btn-sm">Dar Baixa</a>'
              : '<span style="font-size: 12px; color: var(--text-muted)">-</span>';

            html += `
              <tr style="${lt.situacao_validade === 'Vencido' ? 'background-color: #fffafa' : ''}">
                <td><span class="cell-primary" style="font-family: monospace">${lt.numero_lote}</span></td>
                <td>${lt.produto_nome}</td>
                <td>${formatarDataBR(lt.data_producao)}</td>
                <td>${formatarDataBR(lt.data_validade)}</td>
                <td class="num font-semibold">${formatarNumero(lt.quantidade_atual)} un</td>
                <td>${badgeHtml}</td>
                <td style="text-align: right">${acaoHtml}</td>
              </tr>
            `;
          }

          const selectFiltro = document.getElementById('tableCategoryFilter');
          selectFiltro.innerHTML = optsProd;
          document.getElementById('tabelaLotes').innerHTML = html;

          const prodUrl = new URLSearchParams(window.location.search).get('produto');
          if (prodUrl) {
            const valLower = prodUrl.toLowerCase();
            let temOpcao = false;
            for (let i = 0; i < selectFiltro.options.length; i++) {
              if (selectFiltro.options[i].value === valLower) { temOpcao = true; break; }
            }
            if (temOpcao) selectFiltro.value = valLower;
            else document.getElementById('tableSearchInput').value = prodUrl;
          }
          aplicarFiltrosTabela();
        } catch (erro) {
          showToast(erro.message, 'warning');
        }
      }

      document.addEventListener('DOMContentLoaded', carregarLotes);
    </script>
  </body>
</html>

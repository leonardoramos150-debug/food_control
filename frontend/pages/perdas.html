<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Perdas - FoodControl</title>
    <link rel="stylesheet" href="../assets/css/style.css" />
  </head>
  <body data-grupo="Qualidade" data-pagina="Perdas">
    <div class="app-layout">
      <main class="app-main">
        <div class="page-container">
          <div class="page-header">
            <div class="page-title-group">
              <h1>Perdas</h1>
              <p>Registre descartes de produtos com motivo e valor estimado.</p>
            </div>
          </div>

          <div class="grid grid-cols-12">
            <section class="card-panel col-span-5">
              <div class="panel-header">
                <div class="panel-title"><h2>Registrar Perda</h2></div>
              </div>

              <form id="formPerda">
                <div class="form-grid">
                  <div class="form-group full-width">
                    <label for="lossProduto">Produto</label>
                    <select id="lossProduto" class="select-control" required onchange="atualizarLotesPerda(); calcularValorPerda();">
                      <option value="">Carregando...</option>
                    </select>
                  </div>

                  <div class="form-group full-width">
                    <label for="lossLote">Lote</label>
                    <select id="lossLote" class="select-control">
                      <option value="">Sem lote (Avulso)</option>
                    </select>
                  </div>

                  <div class="form-group">
                    <label for="lossQtd">Quantidade</label>
                    <input id="lossQtd" type="number" class="input-control" required value="20" min="1" oninput="calcularValorPerda()" />
                  </div>

                  <div class="form-group">
                    <label for="lossValor">Valor Calculado</label>
                    <input id="lossValor" type="text" class="input-control" readonly value="R$ 0,00" style="background-color: var(--bg-surface-alt); font-weight: 700; color: var(--petroleo-800)" />
                  </div>

                  <div class="form-group full-width">
                    <label for="lossMotivo">Motivo</label>
                    <select id="lossMotivo" class="select-control" required>
                      <option value="Validade">Validade</option>
                      <option value="Embalagem danificada">Embalagem danificada</option>
                      <option value="Armazenamento inadequado">Armazenamento inadequado</option>
                      <option value="Produto fora do padrao">Produto fora do padrão</option>
                      <option value="Erro de producao">Erro de produção</option>
                      <option value="Outros">Outros</option>
                    </select>
                  </div>

                  <div class="form-group full-width">
                    <label for="lossData">Data</label>
                    <input id="lossData" type="date" class="input-control" required />
                  </div>
                </div>

                <div style="display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--border-subtle)">
                  <button type="reset" class="btn btn-secondary">Limpar</button>
                  <button type="submit" class="btn btn-primary" style="background-color: #dc2626; border-color: #dc2626">Registrar Perda</button>
                </div>
              </form>
            </section>

            <section class="card-panel col-span-7">
              <div class="panel-header">
                <div class="panel-title"><h2>Perdas Registradas</h2></div>
                <span id="totalPerdasLabel" style="font-size: 13px; font-weight: 700; color: var(--status-critico-text)">Total no mês: R$ 0,00</span>
              </div>

              <div class="table-responsive">
                <table class="data-table">
                  <thead>
                    <tr>
                      <th>Data</th>
                      <th>Produto</th>
                      <th>Lote</th>
                      <th class="num">Qtd.</th>
                      <th>Motivo</th>
                      <th class="num">Valor</th>
                    </tr>
                  </thead>
                  <tbody id="tabelaPerdas">
                    <tr><td colspan="6" style="text-align: center; color: var(--text-muted)">Carregando...</td></tr>
                  </tbody>
                </table>
              </div>
            </section>
          </div>
        </div>
      </main>
    </div>

    <script src="../assets/js/main.js"></script>
    <script>
      let lotesPerda = [];

      function atualizarLotesPerda() {
        const idProd = parseInt(document.getElementById('lossProduto').value, 10);
        let opts = '<option value="">Sem lote (Avulso)</option>';
        for (let i = 0; i < lotesPerda.length; i++) {
          const lt = lotesPerda[i];
          if (lt.id_produto === idProd && lt.quantidade_atual > 0) {
            opts += `<option value="${lt.id_lote}">${lt.numero_lote} (Saldo: ${lt.quantidade_atual} un | ${lt.situacao_validade})</option>`;
          }
        }
        document.getElementById('lossLote').innerHTML = opts;
      }

      function calcularValorPerda() {
        const select = document.getElementById('lossProduto');
        const opc = select.options[select.selectedIndex];
        const preco = opc ? (parseFloat(opc.getAttribute('data-preco')) || 0) : 0;
        const qtd = parseInt(document.getElementById('lossQtd').value, 10) || 0;
        document.getElementById('lossValor').value = formatarMoeda(preco * qtd);
      }

      async function carregarPerdas() {
        try {
          document.getElementById('lossData').value = hojeLocalIso();
          const [produtos, lotes, perdas] = await Promise.all([apiRequest('/produtos'), apiRequest('/lotes'), apiRequest('/perdas')]);
          lotesPerda = lotes;

          let optsProd = '';
          for (let i = 0; i < produtos.length; i++) {
            if (produtos[i].status === 'Ativo') {
              optsProd += `<option value="${produtos[i].id_produto}" data-preco="${produtos[i].preco}">${produtos[i].nome} (${formatarMoeda(produtos[i].preco)}/un)</option>`;
            }
          }
          document.getElementById('lossProduto').innerHTML = optsProd;
          atualizarLotesPerda();
          calcularValorPerda();

          const mesAtual = hojeLocalIso().slice(0, 7);
          let somaMes = 0;
          let html = '';

          for (let i = 0; i < perdas.length; i++) {
            const p = perdas[i];
            if (String(p.data_perda).startsWith(mesAtual)) somaMes += Number(p.valor_estimado);
            html += `
              <tr>
                <td>${formatarDataBR(p.data_perda)}</td>
                <td>${p.produto_nome}</td>
                <td><span style="font-family: monospace">${p.numero_lote || '(sem lote)'}</span></td>
                <td class="num font-semibold">${formatarNumero(p.quantidade)} un</td>
                <td>${p.motivo}</td>
                <td class="num font-semibold" style="color: var(--status-critico-text)">${formatarMoeda(p.valor_estimado)}</td>
              </tr>
            `;
          }
          document.getElementById('tabelaPerdas').innerHTML = html || '<tr><td colspan="6">Nenhuma perda registrada.</td></tr>';
          document.getElementById('totalPerdasLabel').innerText = `Total no mês: ${formatarMoeda(somaMes)}`;
        } catch (erro) {
          showToast(erro.message, 'warning');
        }
      }

      document.getElementById('formPerda').addEventListener('submit', async (e) => {
        e.preventDefault();
        const usuario = obterUsuarioLogado();
        const loteVal = document.getElementById('lossLote').value;
        try {
          const resp = await apiRequest('/perdas', 'POST', {
            id_produto: parseInt(document.getElementById('lossProduto').value, 10),
            id_lote: loteVal ? parseInt(loteVal, 10) : null,
            quantidade: parseInt(document.getElementById('lossQtd').value, 10),
            motivo: document.getElementById('lossMotivo').value,
            data_perda: document.getElementById('lossData').value,
            id_usuario: usuario ? usuario.id_usuario : 4
          });
          showToast(`Perda registrada (${formatarMoeda(resp.valor_estimado)})!`, 'warning');
          carregarPerdas();
        } catch (erro) {
          showToast(erro.message, 'warning');
        }
      });

      document.addEventListener('DOMContentLoaded', carregarPerdas);
    </script>
  </body>
</html>

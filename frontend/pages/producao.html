<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Produção - FoodControl</title>
    <link rel="stylesheet" href="../assets/css/style.css" />
  </head>
  <body data-grupo="Operação" data-pagina="Produção">
    <div class="app-layout">
      <main class="app-main">
        <div class="page-container">
          <div class="page-header">
            <div class="page-title-group">
              <h1>Produção</h1>
              <p>Registre a produção para gerar o lote e dar entrada no estoque.</p>
            </div>
          </div>

          <div class="grid grid-cols-12">
            <section class="card-panel col-span-7">
              <div class="panel-header">
                <div class="panel-title"><h2>Registrar Produção</h2></div>
                <span id="badgeProximoLote" class="badge badge-petroleo">Próximo: ...</span>
              </div>

              <form id="formProducao">
                <div class="form-grid">
                  <div class="form-group">
                    <label for="pProduto">Produto</label>
                    <select id="pProduto" class="select-control" required onchange="atualizarValidadeSugerida()">
                      <option value="">Carregando...</option>
                    </select>
                  </div>

                  <div class="form-group">
                    <label for="pTurno">Turno</label>
                    <select id="pTurno" class="select-control" required>
                      <option value="Manha">Manhã</option>
                      <option value="Tarde">Tarde</option>
                      <option value="Noite">Noite</option>
                    </select>
                  </div>

                  <div class="form-group">
                    <label for="pQtdPlanejada">Quantidade Planejada</label>
                    <input id="pQtdPlanejada" type="number" class="input-control" required value="300" min="1" />
                  </div>

                  <div class="form-group">
                    <label for="pQtdProduzida">Quantidade Produzida</label>
                    <input id="pQtdProduzida" type="number" class="input-control" required value="300" min="1" />
                  </div>

                  <div class="form-group">
                    <label for="pDataProd">Data da Produção</label>
                    <input id="pDataProd" type="date" class="input-control" required onchange="atualizarValidadeSugerida()" />
                  </div>

                  <div class="form-group">
                    <label for="pDataVal">Validade Sugerida</label>
                    <input id="pDataVal" type="date" class="input-control" required />
                  </div>

                  <div class="form-group full-width">
                    <label for="pObs">Observação</label>
                    <textarea id="pObs" class="textarea-control" placeholder="Opcional. Ex: Selagem e congelamento conforme."></textarea>
                  </div>
                </div>

                <div style="display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--border-subtle)">
                  <button type="reset" class="btn btn-secondary">Limpar</button>
                  <button type="submit" class="btn btn-primary">Registrar Produção</button>
                </div>
              </form>
            </section>

            <section class="card-panel col-span-5">
              <div class="panel-header">
                <div class="panel-title"><h2>Produções Recentes</h2></div>
              </div>
              <div class="table-responsive">
                <table class="data-table">
                  <thead>
                    <tr>
                      <th>Lote</th>
                      <th>Produto</th>
                      <th>Data</th>
                      <th class="num">Qtd.</th>
                    </tr>
                  </thead>
                  <tbody id="tabelaProducoes">
                    <tr><td colspan="4" style="text-align: center; color: var(--text-muted)">Carregando...</td></tr>
                  </tbody>
                </table>
              </div>
            </section>
          </div>
        </div>
      </main>
    </div>

    <script src="../assets/js/main.js"></script>
    <script>
      function atualizarValidadeSugerida() {
        const prod = document.getElementById('pProduto');
        const opc = prod.options[prod.selectedIndex];
        if (!opc || !opc.value) return;
        const dias = parseInt(opc.getAttribute('data-dias'), 10) || 90;
        const p = (document.getElementById('pDataProd').value || hojeLocalIso()).split('-');
        const dt = new Date(parseInt(p[0], 10), parseInt(p[1], 10) - 1, parseInt(p[2], 10));
        dt.setDate(dt.getDate() + dias);
        document.getElementById('pDataVal').value = dt.toLocaleDateString('en-CA');
      }

      async function carregarTelaProducao() {
        try {
          document.getElementById('pDataProd').value = hojeLocalIso();
          const [prox, produtos, producoes] = await Promise.all([
            apiRequest('/producao/proximo-lote'),
            apiRequest('/produtos'),
            apiRequest('/producao')
          ]);

          document.getElementById('badgeProximoLote').innerText = `Próximo: ${prox.proximo_lote}`;

          let opts = '';
          for (let i = 0; i < produtos.length; i++) {
            const p = produtos[i];
            if (p.status !== 'Ativo') continue;
            opts += `<option value="${p.id_produto}" data-dias="${p.validade_padrao_dias}">${p.nome}</option>`;
          }
          document.getElementById('pProduto').innerHTML = opts;
          atualizarValidadeSugerida();

          let html = '';
          for (let i = 0; i < producoes.length && i < 10; i++) {
            const pr = producoes[i];
            html += `
              <tr>
                <td><span style="font-family: monospace; font-weight: 600">${pr.numero_lote}</span></td>
                <td>${pr.produto_nome}</td>
                <td>${formatarDataBR(pr.data_producao)}</td>
                <td class="num font-semibold">${formatarNumero(pr.quantidade_produzida)} un</td>
              </tr>
            `;
          }
          document.getElementById('tabelaProducoes').innerHTML = html || '<tr><td colspan="4">Nenhuma produção registrada.</td></tr>';
        } catch (erro) {
          showToast(erro.message, 'warning');
        }
      }

      document.getElementById('formProducao').addEventListener('submit', async (e) => {
        e.preventDefault();
        const usuario = obterUsuarioLogado();
        const dados = {
          id_produto: parseInt(document.getElementById('pProduto').value, 10),
          turno: document.getElementById('pTurno').value,
          quantidade_planejada: parseInt(document.getElementById('pQtdPlanejada').value, 10),
          quantidade_produzida: parseInt(document.getElementById('pQtdProduzida').value, 10),
          data_producao: document.getElementById('pDataProd').value,
          data_validade: document.getElementById('pDataVal').value,
          id_usuario: usuario ? usuario.id_usuario : 2,
          observacao: document.getElementById('pObs').value.trim()
        };

        try {
          const resp = await apiRequest('/producao', 'POST', dados);
          showToast(`Produção registrada! Lote ${resp.numero_lote} gerado.`, 'success');
          document.getElementById('pObs').value = '';
          carregarTelaProducao();
        } catch (erro) {
          showToast(erro.message, 'warning');
        }
      });

      document.addEventListener('DOMContentLoaded', carregarTelaProducao);
    </script>
  </body>
</html>

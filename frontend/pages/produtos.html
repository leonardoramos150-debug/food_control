<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Produtos - FoodControl</title>
    <link rel="stylesheet" href="../assets/css/style.css" />
  </head>
  <body data-grupo="Operação" data-pagina="Produtos">
    <div class="app-layout">
      <main class="app-main">
        <div class="page-container">
          <div class="page-header">
            <div class="page-title-group">
              <h1>Produtos</h1>
              <p>Cadastro de produtos, preços e estoque mínimo.</p>
            </div>
            <div class="page-actions">
              <button type="button" class="btn btn-primary" data-modal-target="modalNovoProduto">+ Novo Produto</button>
            </div>
          </div>

          <section class="card-panel">
            <div class="filter-bar">
              <div class="filter-group" style="flex: 1; min-width: 220px">
                <label for="tableSearchInput">Pesquisar Produto</label>
                <input type="search" id="tableSearchInput" class="input-control" placeholder="Digite o nome do produto..." />
              </div>

              <div class="filter-group">
                <label for="tableCategoryFilter">Categoria</label>
                <select id="tableCategoryFilter" class="select-control">
                  <option value="todas">Todas as Categorias</option>
                  <option value="congelado">Congelado</option>
                  <option value="salgado">Salgado</option>
                  <option value="massa">Massa</option>
                  <option value="refeicao pronta">Refeição pronta</option>
                </select>
              </div>

              <div class="filter-group">
                <label for="tableStatusFilter">Estoque</label>
                <select id="tableStatusFilter" class="select-control">
                  <option value="todos">Todos</option>
                  <option value="normal">Normal</option>
                  <option value="baixo">Abaixo do Mínimo</option>
                </select>
              </div>

              <div style="margin-left: auto; align-self: flex-end; padding-bottom: 6px">
                <span id="tableRowCount" style="font-size: 12px; color: var(--text-muted); font-weight: 600">Carregando...</span>
              </div>
            </div>

            <div class="table-responsive">
              <table class="data-table">
                <thead>
                  <tr>
                    <th>Produto</th>
                    <th>Categoria</th>
                    <th class="num">Preço</th>
                    <th class="num">Estoque</th>
                    <th class="num">Mínimo</th>
                    <th>Situação</th>
                    <th style="text-align: right">Ações</th>
                  </tr>
                </thead>
                <tbody id="tabelaProdutos">
                  <tr><td colspan="7" style="text-align: center; color: var(--text-muted)">Carregando produtos...</td></tr>
                </tbody>
              </table>
            </div>
          </section>
        </div>
      </main>
    </div>

    <div id="modalNovoProduto" class="modal-backdrop">
      <div class="modal-box">
        <div class="modal-header">
          <h3 id="modalProdutoTitulo">Novo Produto</h3>
          <button type="button" class="modal-close-btn" style="font-size: 20px; line-height: 1" data-modal-close>&times;</button>
        </div>
        <form id="formProduto">
          <input type="hidden" id="mProdutoId" />
          <div class="modal-body">
            <div class="form-grid">
              <div class="form-group full-width">
                <label for="mNome">Nome do Produto</label>
                <input id="mNome" type="text" class="input-control" required placeholder="Ex: Panqueca de Frango" />
              </div>

              <div class="form-group">
                <label for="mCategoria">Categoria</label>
                <select id="mCategoria" class="select-control" required>
                  <option value="Congelado">Congelado</option>
                  <option value="Salgado">Salgado</option>
                  <option value="Massa">Massa</option>
                  <option value="Refeicao pronta">Refeição pronta</option>
                </select>
              </div>

              <div class="form-group">
                <label for="mPreco">Preço Unitário (R$)</label>
                <input id="mPreco" type="number" step="0.01" class="input-control" required placeholder="0,00" />
              </div>

              <div class="form-group">
                <label for="mMinimo">Estoque Mínimo</label>
                <input id="mMinimo" type="number" class="input-control" required placeholder="Ex: 100" />
              </div>

              <div class="form-group">
                <label for="mMaximo">Estoque Máximo</label>
                <input id="mMaximo" type="number" class="input-control" required value="1000" />
              </div>

              <div class="form-group full-width">
                <label for="mValidade">Validade Padrão (dias)</label>
                <input id="mValidade" type="number" class="input-control" required value="90" />
              </div>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-modal-close>Cancelar</button>
            <button type="submit" class="btn btn-primary">Salvar Produto</button>
          </div>
        </form>
      </div>
    </div>

    <script src="../assets/js/main.js"></script>
    <script>
      let listaProdutos = [];

      async function carregarProdutos() {
        try {
          const produtos = await apiRequest('/produtos');
          listaProdutos = produtos;

          const usuario = obterUsuarioLogado();
          const ehAdmin = usuario && usuario.perfil === 'administrador';
          const btnNovo = document.querySelector('[data-modal-target="modalNovoProduto"]');
          if (btnNovo && !ehAdmin) btnNovo.style.display = 'none';

          let html = '';
          for (let i = 0; i < produtos.length; i++) {
            const p = produtos[i];
            const badgeSit = p.situacao_estoque === 'Baixo' ? criarBadge('badge-atencao', 'Baixo') : criarBadge('badge-normal', 'Normal');
            const corEst = p.situacao_estoque === 'Baixo' ? 'color: var(--status-critico-text)' : '';
            const tagInativo = p.status === 'Inativo' ? ' ' + criarBadge('badge-critico', 'Inativo', false) : '';
            const acoesAdmin = ehAdmin
              ? `<button type="button" class="btn btn-secondary btn-sm" onclick="editarProduto(${p.id_produto})">Editar</button>
                 <button type="button" class="btn btn-danger-outline btn-sm" onclick="alternarStatusProduto(${p.id_produto}, '${p.status}')">${p.status === 'Ativo' ? 'Inativar' : 'Ativar'}</button>`
              : '';

            html += `
              <tr style="${p.status === 'Inativo' ? 'opacity: 0.6' : ''}">
                <td><span class="cell-primary">${p.nome}</span>${tagInativo}</td>
                <td>${p.categoria}</td>
                <td class="num font-semibold">${formatarMoeda(p.preco)}</td>
                <td class="num font-semibold" style="${corEst}">${formatarNumero(p.estoque_disponivel)} un</td>
                <td class="num" style="color: var(--text-muted)">${formatarNumero(p.estoque_minimo)} un</td>
                <td>${badgeSit}</td>
                <td style="text-align: right; display: flex; gap: 6px; justify-content: flex-end">
                  <a href="lotes.html?produto=${encodeURIComponent(p.nome)}" class="btn btn-secondary btn-sm">Lotes</a>${acoesAdmin}
                </td>
              </tr>
            `;
          }

          document.getElementById('tabelaProdutos').innerHTML = html;
          aplicarFiltrosTabela();
        } catch (erro) {
          showToast(erro.message, 'warning');
        }
      }

      function editarProduto(id) {
        let prod = null;
        for (let i = 0; i < listaProdutos.length; i++) {
          if (listaProdutos[i].id_produto === id) { prod = listaProdutos[i]; break; }
        }
        if (!prod) return;
        document.getElementById('modalProdutoTitulo').innerText = 'Editar Produto';
        document.getElementById('mProdutoId').value = prod.id_produto;
        document.getElementById('mNome').value = prod.nome;
        document.getElementById('mCategoria').value = prod.categoria;
        document.getElementById('mPreco').value = prod.preco;
        document.getElementById('mMinimo').value = prod.estoque_minimo;
        document.getElementById('mMaximo').value = prod.estoque_maximo;
        document.getElementById('mValidade').value = prod.validade_padrao_dias;
        abrirModal('modalNovoProduto');
      }

      async function alternarStatusProduto(id, statusAtual) {
        const novo = statusAtual === 'Ativo' ? 'Inativo' : 'Ativo';
        if (!confirm(`Deseja ${novo === 'Inativo' ? 'inativar' : 'ativar'} este produto?`)) return;
        try {
          await apiRequest(`/produtos/${id}/status`, 'PUT', { status: novo });
          showToast(`Produto alterado para ${novo}.`, 'success');
          carregarProdutos();
        } catch (erro) {
          showToast(erro.message, 'warning');
        }
      }

      document.getElementById('formProduto').addEventListener('submit', async (e) => {
        e.preventDefault();
        const id = document.getElementById('mProdutoId').value;
        const dados = {
          nome: document.getElementById('mNome').value.trim(),
          categoria: document.getElementById('mCategoria').value,
          preco: Number(document.getElementById('mPreco').value),
          estoque_minimo: parseInt(document.getElementById('mMinimo').value, 10),
          estoque_maximo: parseInt(document.getElementById('mMaximo').value, 10),
          validade_padrao_dias: parseInt(document.getElementById('mValidade').value, 10)
        };

        try {
          if (id) {
            await apiRequest(`/produtos/${id}`, 'PUT', dados);
            showToast('Produto atualizado com sucesso!', 'success');
          } else {
            await apiRequest('/produtos', 'POST', dados);
            showToast('Produto cadastrado com sucesso!', 'success');
          }
          document.getElementById('formProduto').reset();
          document.getElementById('mProdutoId').value = '';
          document.getElementById('modalProdutoTitulo').innerText = 'Novo Produto';
          fecharModal('modalNovoProduto');
          carregarProdutos();
        } catch (erro) {
          showToast(erro.message, 'warning');
        }
      });

      document.querySelector('[data-modal-target="modalNovoProduto"]')?.addEventListener('click', () => {
        document.getElementById('formProduto').reset();
        document.getElementById('mProdutoId').value = '';
        document.getElementById('modalProdutoTitulo').innerText = 'Novo Produto';
      });

      document.addEventListener('DOMContentLoaded', carregarProdutos);
    </script>
  </body>
</html>

<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Alertas - FoodControl</title>
    <link rel="stylesheet" href="../assets/css/style.css" />
  </head>
  <body data-grupo="Qualidade" data-pagina="Alertas">
    <div class="app-layout">
      <main class="app-main">
        <div class="page-container">
          <div class="page-header">
            <div class="page-title-group">
              <h1>Alertas</h1>
              <p>Avisos de validade, estoque mínimo, perdas e pedidos.</p>
            </div>
            <div class="page-actions">
              <button type="button" class="btn btn-primary" onclick="atualizarAlertas()">Atualizar Alertas</button>
            </div>
          </div>

          <section class="card-panel">
            <div class="filter-bar">
              <div class="filter-group">
                <label for="fTipo">Categoria</label>
                <select id="fTipo" class="select-control" onchange="renderizarAlertas()">
                  <option value="Todas">Todas</option>
                  <option value="Validade">Validade</option>
                  <option value="Estoque">Estoque</option>
                  <option value="Desperdicio">Desperdício</option>
                  <option value="Pedido">Pedido</option>
                </select>
              </div>

              <div class="filter-group">
                <label for="fNivel">Severidade</label>
                <select id="fNivel" class="select-control" onchange="renderizarAlertas()">
                  <option value="Todas">Todas</option>
                  <option value="Critico">Crítico</option>
                  <option value="Atencao">Atenção</option>
                </select>
              </div>

              <div class="filter-group">
                <label for="fStatusAlerta">Status</label>
                <select id="fStatusAlerta" class="select-control" onchange="renderizarAlertas()">
                  <option value="Aberto">Abertos</option>
                  <option value="Resolvido">Resolvidos</option>
                  <option value="Todos">Todos</option>
                </select>
              </div>

              <div style="margin-left: auto; align-self: flex-end; padding-bottom: 6px">
                <span id="badgeAlertasAtivos" class="panel-badge">0 alertas ativos</span>
              </div>
            </div>

            <div id="listaAlertas">
              <p style="font-size: 13px; color: var(--text-muted)">Carregando alertas...</p>
            </div>
          </section>
        </div>
      </main>
    </div>

    <script src="../assets/js/main.js"></script>
    <script>
      let todosAlertas = [];

      function renderizarAlertas() {
        const tipoSel = document.getElementById('fTipo').value;
        const nivelSel = document.getElementById('fNivel').value;
        const statusSel = document.getElementById('fStatusAlerta').value;
        let abertos = 0;
        let html = '';

        for (let i = 0; i < todosAlertas.length; i++) {
          const a = todosAlertas[i];
          if (a.status === 'Aberto') abertos++;
          if (tipoSel !== 'Todas' && a.tipo !== tipoSel) continue;
          if (nivelSel !== 'Todas' && a.nivel !== nivelSel) continue;
          if (statusSel !== 'Todos' && a.status !== statusSel) continue;

          const classeItem = a.nivel === 'Critico' ? 'critico' : 'atencao';
          const badgeTipo = criarBadge(a.nivel === 'Critico' ? 'badge-critico' : 'badge-atencao', a.tipo === 'Desperdicio' ? 'Desperdício' : a.tipo, false);
          const acaoHtml = a.status === 'Aberto'
            ? `<button type="button" class="btn btn-secondary btn-sm" onclick="resolverAlerta(${a.id_alerta})">Resolver</button>`
            : criarBadge('badge-normal', 'Resolvido', false);

          html += `
            <div class="alert-item ${classeItem}">
              <div class="alert-content">
                <div class="alert-content-title">${badgeTipo} ${a.mensagem}</div>
                <div class="alert-content-desc">Gerado em ${formatarDataBR(a.data_geracao)} • Severidade: ${a.nivel === 'Critico' ? 'Crítico' : 'Atenção'}</div>
              </div>
              <div class="alert-action">${acaoHtml}</div>
            </div>
          `;
        }

        document.getElementById('badgeAlertasAtivos').innerText = `${abertos} alerta(s) ativo(s)`;
        document.getElementById('listaAlertas').innerHTML = html || '<p style="font-size: 13px; color: var(--text-muted)">Nenhum alerta encontrado para o filtro selecionado.</p>';
      }

      async function carregarAlertas() {
        try {
          todosAlertas = await apiRequest('/alertas');
          renderizarAlertas();
          atualizarContadorAlertas();
        } catch (erro) {
          showToast(erro.message, 'warning');
        }
      }

      async function resolverAlerta(id) {
        try {
          await apiRequest(`/alertas/${id}/resolver`, 'PUT');
          showToast('Alerta marcado como resolvido.', 'success');
          carregarAlertas();
        } catch (erro) {
          showToast(erro.message, 'warning');
        }
      }

      async function atualizarAlertas() {
        try {
          const resp = await apiRequest('/alertas/atualizar', 'POST');
          showToast(`Atualizado: ${resp.alertas_criados} criado(s), ${resp.alertas_resolvidos} resolvido(s).`, 'info');
          carregarAlertas();
        } catch (erro) {
          showToast(erro.message, 'warning');
        }
      }

      document.addEventListener('DOMContentLoaded', carregarAlertas);
    </script>
  </body>
</html>

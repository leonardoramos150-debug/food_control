<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Relatórios - FoodControl</title>
    <link rel="stylesheet" href="../assets/css/style.css" />
  </head>
  <body data-grupo="Administração" data-pagina="Relatórios">
    <div class="app-layout">
      <main class="app-main">
        <div class="page-container">
          <div class="page-header">
            <div class="page-title-group">
              <h1>Relatórios</h1>
              <p>Consulte perdas, produção, pedidos e posição de estoque.</p>
            </div>
          </div>

          <div class="grid grid-cols-2" style="margin-bottom: 22px">
            <section class="card-panel">
              <div class="panel-header"><div class="panel-title"><h2>Relatórios por Período</h2></div></div>
              <p style="font-size: 13px; color: var(--text-secondary); margin-bottom: 14px">
                Selecione as datas para consultar perdas, produção ou pedidos.
              </p>
              <div class="filter-bar" style="margin-bottom: 14px; padding: 10px">
                <div class="filter-group">
                  <label for="relPerdaDe">De</label>
                  <input id="relPerdaDe" type="date" class="input-control" style="min-width: 120px" />
                </div>
                <div class="filter-group">
                  <label for="relPerdaAte">Até</label>
                  <input id="relPerdaAte" type="date" class="input-control" style="min-width: 120px" />
                </div>
              </div>
              <div style="display: flex; justify-content: flex-end; gap: 8px">
                <button type="button" class="btn btn-secondary" onclick="emitirRelatorioProducao()">Produção</button>
                <button type="button" class="btn btn-secondary" onclick="emitirRelatorioPedidos()">Pedidos</button>
                <button type="button" class="btn btn-primary" onclick="emitirRelatorioPerdas()">Emitir Perdas</button>
              </div>
            </section>

            <section class="card-panel">
              <div class="panel-header"><div class="panel-title"><h2>Relatório de Estoque</h2></div></div>
              <p style="font-size: 13px; color: var(--text-secondary); margin-bottom: 14px">
                Posição física e lotes próximos da validade.
              </p>
              <div class="filter-bar" style="margin-bottom: 14px; padding: 10px">
                <div class="filter-group" style="flex: 1">
                  <label for="relEstoqueSit">Condição</label>
                  <select id="relEstoqueSit" class="select-control">
                    <option value="todos">Todos os Saldos</option>
                    <option value="minimo">Abaixo do Mínimo</option>
                    <option value="validade">Próximos da Validade</option>
                  </select>
                </div>
              </div>
              <div style="display: flex; justify-content: flex-end; margin-top: auto">
                <button type="button" class="btn btn-primary" onclick="emitirRelatorioEstoque()">Emitir</button>
              </div>
            </section>
          </div>

          <section class="card-panel">
            <div class="panel-header">
              <div class="panel-title"><h2 id="tituloResultadoRelatorio">Perdas por Motivo (Mês Atual)</h2></div>
              <span id="totalResultadoRelatorio" style="font-size: 13px; font-weight: 700; color: var(--status-critico-text)">Carregando...</span>
            </div>
            <div class="table-responsive" id="areaResultadoRelatorio">
              <p style="font-size: 13px; color: var(--text-muted)">Carregando dados...</p>
            </div>
          </section>
        </div>
      </main>
    </div>

    <script src="../assets/js/main.js"></script>
    <script>
      function mostrarTabela(titulo, resumo, colunas, linhasHtml) {
        document.getElementById('tituloResultadoRelatorio').innerText = titulo;
        document.getElementById('totalResultadoRelatorio').innerText = resumo;
        document.getElementById('areaResultadoRelatorio').innerHTML = `<table class="data-table"><thead><tr>${colunas}</tr></thead><tbody>${linhasHtml}</tbody></table>`;
      }

      async function emitirRelatorioPerdas() {
        const inicio = document.getElementById('relPerdaDe').value;
        const fim = document.getElementById('relPerdaAte').value;
        try {
          const dados = await apiRequest(`/relatorios/perdas/${inicio}/${fim}`);
          document.getElementById('tituloResultadoRelatorio').innerText = `Perdas (${formatarDataBR(inicio)} a ${formatarDataBR(fim)})`;
          document.getElementById('totalResultadoRelatorio').innerText = `Total: ${formatarMoeda(dados.totais.valor_total)} (${dados.totais.total_unidades} un)`;

          let motHtml = '';
          for (let i = 0; i < dados.por_motivo.length; i++) {
            const m = dados.por_motivo[i];
            motHtml += `<tr><td><span class="cell-primary">${m.motivo}</span></td><td class="num">${m.unidades} un</td><td class="num font-semibold">${formatarMoeda(m.valor_perdido)}</td><td class="num font-semibold">${m.percentual}%</td></tr>`;
          }
          let html = `<table class="data-table" style="margin-bottom: 18px"><thead><tr><th>Motivo</th><th class="num">Unidades</th><th class="num">Valor Perdido</th><th class="num">Participação</th></tr></thead><tbody>${motHtml}</tbody></table>`;

          if (dados.itens.length > 0) {
            let itensHtml = '';
            for (let i = 0; i < dados.itens.length; i++) {
              const it = dados.itens[i];
              itensHtml += `<tr><td>${formatarDataBR(it.data_perda)}</td><td>${it.produto_nome}</td><td style="font-family:monospace">${it.numero_lote || '-'}</td><td class="num">${it.quantidade} un</td><td>${it.motivo}</td><td class="num font-semibold">${formatarMoeda(it.valor_estimado)}</td></tr>`;
            }
            html += `<table class="data-table"><thead><tr><th>Data</th><th>Produto</th><th>Lote</th><th class="num">Qtd.</th><th>Motivo</th><th class="num">Valor</th></tr></thead><tbody>${itensHtml}</tbody></table>`;
          }
          document.getElementById('areaResultadoRelatorio').innerHTML = html;
        } catch (erro) {
          showToast(erro.message, 'warning');
        }
      }

      async function emitirRelatorioEstoque() {
        const condicao = document.getElementById('relEstoqueSit').value;
        try {
          const dados = await apiRequest('/relatorios/estoque');
          if (condicao === 'validade') {
            let linhas = '';
            for (let i = 0; i < dados.lotes_atencao.length; i++) {
              const lt = dados.lotes_atencao[i];
              linhas += `<tr><td style="font-family:monospace">${lt.numero_lote}</td><td>${lt.produto_nome}</td><td>${formatarDataBR(lt.data_validade)} (${lt.dias_para_vencer}d)</td><td class="num font-semibold">${lt.quantidade_atual} un</td><td>${lt.status}</td></tr>`;
            }
            return mostrarTabela('Lotes Próximos da Validade ou Vencidos', `${dados.lotes_atencao.length} lote(s)`, '<th>Lote</th><th>Produto</th><th>Validade</th><th class="num">Saldo</th><th>Status</th>', linhas);
          }

          let linhas = '';
          for (let i = 0; i < dados.produtos.length; i++) {
            const p = dados.produtos[i];
            if (condicao === 'minimo' && p.estoque_disponivel >= p.estoque_minimo) continue;
            linhas += `<tr><td><span class="cell-primary">${p.nome}</span></td><td class="num font-semibold">${formatarNumero(p.estoque_disponivel)} un</td><td class="num">${formatarNumero(p.estoque_minimo)} un</td><td class="num">${p.indice_risco}</td><td>${p.nivel_risco}</td></tr>`;
          }
          mostrarTabela('Posição de Estoque por Produto', `Total: ${formatarNumero(dados.resumo.estoque_total)} un (${dados.resumo.produtos_abaixo_minimo} abaixo do mínimo)`, '<th>Produto</th><th class="num">Disponível</th><th class="num">Mínimo</th><th class="num">Índice Risco</th><th>Nível</th>', linhas);
        } catch (erro) {
          showToast(erro.message, 'warning');
        }
      }

      async function emitirRelatorioProducao() {
        const inicio = document.getElementById('relPerdaDe').value;
        const fim = document.getElementById('relPerdaAte').value;
        try {
          const dados = await apiRequest(`/relatorios/producao/${inicio}/${fim}`);
          let linhas = '';
          for (let i = 0; i < dados.itens.length; i++) {
            const it = dados.itens[i];
            linhas += `<tr><td>${formatarDataBR(it.data_producao)}</td><td style="font-family:monospace">${it.numero_lote}</td><td>${it.produto_nome}</td><td class="num">${it.quantidade_planejada} un</td><td class="num font-semibold">${it.quantidade_produzida} un</td><td>${it.turno}</td><td>${it.responsavel}</td></tr>`;
          }
          mostrarTabela(`Relatório de Produção (${formatarDataBR(inicio)} a ${formatarDataBR(fim)})`, `${formatarNumero(dados.totais.total_produzida)} de ${formatarNumero(dados.totais.total_planejada)} un (${dados.totais.aderencia_percentual}%)`, '<th>Data</th><th>Lote</th><th>Produto</th><th class="num">Planejada</th><th class="num">Produzida</th><th>Turno</th><th>Responsável</th>', linhas);
        } catch (erro) {
          showToast(erro.message, 'warning');
        }
      }

      async function emitirRelatorioPedidos() {
        const inicio = document.getElementById('relPerdaDe').value;
        const fim = document.getElementById('relPerdaAte').value;
        try {
          const dados = await apiRequest(`/relatorios/pedidos/${inicio}/${fim}`);
          let linhas = '';
          for (let i = 0; i < dados.pedidos.length; i++) {
            const p = dados.pedidos[i];
            linhas += `<tr><td style="font-family:monospace">#${p.id_pedido}</td><td>${p.cliente}</td><td>${formatarDataBR(p.data_pedido)}</td><td>${formatarDataBR(p.data_entrega)}</td><td>${p.status}</td><td class="num font-semibold">${formatarMoeda(p.valor_total)}</td></tr>`;
          }
          mostrarTabela(`Relatório de Pedidos (${formatarDataBR(inicio)} a ${formatarDataBR(fim)})`, `${dados.resumo.total_pedidos} pedido(s) • ${formatarMoeda(dados.resumo.valor_total)}`, '<th>Nº</th><th>Cliente</th><th>Pedido</th><th>Entrega</th><th>Status</th><th class="num">Valor</th>', linhas);
        } catch (erro) {
          showToast(erro.message, 'warning');
        }
      }

      document.addEventListener('DOMContentLoaded', () => {
        document.getElementById('relPerdaDe').value = primeiroDiaMesIso();
        document.getElementById('relPerdaAte').value = hojeLocalIso();
        emitirRelatorioPerdas();
      });
    </script>
  </body>
</html>

<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Entrar - FoodControl 4.0</title>
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body class="login">
    <main class="cartao">
      <img src="assets/img/logo.png" alt="FoodControl 4.0" />
      <h1>Entrar no sistema</h1>
      <p>SaborSul Alimentos Ltda.</p>
      <form action="pages/dashboard.html">
        <div class="campo">
          <label for="email">E-mail</label
          ><input
            id="email"
            type="email"
            placeholder="nome@saborsul.com.br"
            required
          />
        </div>
        <div class="campo">
          <label for="senha">Senha</label
          ><input id="senha" type="password" required />
        </div>
        <button class="botao" type="submit">Entrar</button>
      </form>
    </main>
  </body>
</html>
